<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and floating animations */
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1.5deg); }
      100% { transform: translateY(0px) rotate(-1deg); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px) rotate(2deg); }
      50% { transform: translateY(-18px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(2deg); }
    }
    @keyframes floatCard3 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.85; }
      100% { opacity: 0.3; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: pulseOrb 11s ease-in-out infinite reverse; transform-origin: center; }
    .card-1 { animation: floatCard1 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .card-2 { animation: floatCard2 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .card-3 { animation: floatCard3 6.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow-line { stroke-dasharray: 12, 12; animation: flowLine 5s linear infinite; }
    .shimmer-badge { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Background Orbs -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="220" cy="90" r="130" fill="#4f46e5" opacity="0.3" />
    <circle class="orb-2" cx="980" cy="260" r="160" fill="#ec4899" opacity="0.25" />
    <circle class="orb-1" cx="840" cy="80" r="110" fill="#06b6d4" opacity="0.2" />
  </g>

  <!-- Subtle Architectural Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Data Flow Connecting Lines in Background -->
  <g fill="none" stroke-width="2">
    <path class="flow-line" d="M 720,180 C 820,120 860,260 970,180" stroke="url(#accentGrad)" opacity="0.4" />
    <path class="flow-line" d="M 780,240 C 880,310 930,100 1060,140" stroke="#06b6d4" opacity="0.3" />
  </g>

  <!-- Interactive Decorative Floating Element 1: Campaign Delivery Pill -->
  <g class="card-1" opacity="0.85">
    <rect x="850" y="55" width="230" height="52" rx="26" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <circle cx="876" cy="81" r="14" fill="#10b981" fill-opacity="0.2" />
    <circle cx="876" cy="81" r="6" fill="#10b981" />
    <text x="900" y="86" fill="#f3f4f6" font-size="13" font-weight="600">99.8% Inbox Placement</text>
  </g>

  <!-- Interactive Decorative Floating Element 2: Automation Card -->
  <g class="card-2" opacity="0.9">
    <rect x="890" y="145" width="250" height="72" rx="14" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
    <path d="M 915 170 L 935 170 L 930 185 L 945 185 L 925 205 L 930 190 L 915 190 Z" fill="#f59e0b" />
    <text x="955" y="176" fill="#ffffff" font-size="14" font-weight="700">Drip Automation</text>
    <text x="955" y="196" fill="#94a3b8" font-size="12">1.2M+ Sequences Sent</text>
  </g>

  <!-- Interactive Decorative Floating Element 3: Open-Source Badge Card -->
  <g class="card-3" opacity="0.85">
    <rect x="800" y="245" width="220" height="54" rx="27" fill="#111827" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="830" cy="272" r="14" fill="#ec4899" fill-opacity="0.2" />
    <text x="824" y="277" fill="#f43f5e" font-size="15">⚡</text>
    <text x="852" y="277" fill="#e2e8f0" font-size="13" font-weight="600">Self-Hosted Scale</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Description, Category Tags -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect class="shimmer-badge" width="248" height="30" rx="15" fill="#4f46e5" fill-opacity="0.25" stroke="#6366f1" stroke-width="1" />
      <text x="16" y="20" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1">📬 CURATED TECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.5">Awesome Email Marketing</text>
    <text x="0" y="192" fill="url(#accentGrad)" font-size="36" font-weight="800" letter-spacing="-0.5">Platform &amp; Infrastructure</text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="235" fill="#94a3b8" font-size="16" font-weight="400">
      Leading SaaS providers, modern open-source engines &amp; self-hosted campaign stacks.
    </text>

    <!-- Bottom Feature Badges / Meta Pills -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <rect width="130" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="500">📊 SaaS Leaders</text>

      <!-- Pill 2 -->
      <rect x="142" width="168" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="156" y="20" fill="#cbd5e1" font-size="12" font-weight="500">⚡ Open-Source Stacks</text>

      <!-- Pill 3 -->
      <rect x="322" width="176" height="32" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="336" y="20" fill="#cbd5e1" font-size="12" font-weight="500">🎯 Deliverability &amp; API</text>
    </g>
  </g>
</svg>
